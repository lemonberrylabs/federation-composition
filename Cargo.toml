[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/lemonberrylabs/federation-composition"
# The oldest toolchain that checks every target of the workspace with Cargo.lock, found by
# trying each release (CONTRIBUTING.md, "Minimum supported Rust version"); the msrv job of
# .github/workflows/ci.yml keeps it true.
rust-version = "1.87"
authors = ["Ran Magen"]

[workspace.dependencies]
indexmap = "2"
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }

[profile.release]
lto = true
codegen-units = 1
