[package]
name = "federation_composition"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
# Renamed: `crate::graphql` is the port of `src/graphql/`.
graphql_js = { package = "graphql", path = "../graphql" }
serde.workspace = true
serde_json.workspace = true
# Only for the benchmark and profiling examples (`--features mimalloc`): a library must not
# choose its users' global allocator, so nothing in src/ uses it.
mimalloc = { version = "0.1.52", optional = true }

[features]
mimalloc = ["dep:mimalloc"]
