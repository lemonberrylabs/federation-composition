[package]
name = "federation-composition-wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
authors.workspace = true
# Not published to crates.io: it ships inside the npm package federation-composition-wasm
# (npm/), released by .github/workflows/npm-publish.yml.
publish = false
readme = "README.md"
description = "wasm-bindgen bindings of federation_composition_rs, used by the npm package federation-composition-wasm (npm/)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
graphql-rs = { version = "0.1.0", path = "../graphql-rs" }
federation-composition-rs = { version = "0.1.0", path = "../federation-composition-rs" }
# wasm-bindgen must match the wasm-bindgen-cli version exactly (npm/build.mjs checks).
wasm-bindgen = "=0.2.129"
js-sys = "=0.3.106"
serde = { workspace = true }
serde_json = { workspace = true, features = ["unbounded_depth"] }

# The global allocator of the WebAssembly build (see src/lib.rs).
[target.'cfg(target_family = "wasm")'.dependencies]
talc = "5.1.1"
