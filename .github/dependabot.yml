# Dependency updates: the Rust crates, the pnpm workspace (npm/, conformance/, research/) and
# the pinned GitHub Actions. Upstream's own dependencies are not here: the conformance check
# installs them from upstream's lockfile at the release in UPSTREAM.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      # The wasm-bindgen crates move together (and the CI installs the matching CLI from
      # Cargo.lock).
      wasm-bindgen:
        patterns: ["wasm-bindgen*", "js-sys"]
      cargo-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns: ["*"]
