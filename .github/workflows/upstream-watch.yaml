# Weekly: when upstream has a release newer than UPSTREAM, runs the conformance check against
# it and opens or updates the issue labelled `upstream-sync` with the porting task (the src/
# and __tests__/ diff, the failing upstream tests and the changed outputs).
name: Upstream watch
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  watch:
    name: Watch upstream
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: setup
        uses: ./.github/actions/setup
      - name: label
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh label create upstream-sync --color 0E8A16 --description "Porting a new upstream release" --force
      - name: watch
        env:
          GH_TOKEN: ${{ github.token }}
        run: node conformance/watch.mjs --issue
      - name: upload the porting task
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-sync
          path: |
            conformance/out/issue.md
            conformance/out/upstream.diff
            conformance/out/summary.json
            target/corpus-mismatches.jsonl
          if-no-files-found: ignore
