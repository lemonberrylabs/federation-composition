name: Setup
description: Rust (with wasm32 and the matching wasm-bindgen CLI), Node, pnpm and the workspace's dependencies (Linux runners)
runs:
  using: composite
  steps:
    - name: setup rust
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-10-16)
      with:
        toolchain: stable
        targets: wasm32-unknown-unknown
    - name: cache cargo
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
    - name: wasm-bindgen version
      id: wasm-bindgen
      shell: bash
      # Must match the wasm-bindgen crate in Cargo.lock exactly (npm/build.mjs checks).
      run: |
        echo "version=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/"/, "", $3); print $3 }' Cargo.lock)" >> "$GITHUB_OUTPUT"
    - name: install wasm-bindgen-cli
      uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
      with:
        tool: wasm-bindgen@${{ steps.wasm-bindgen.outputs.version }}
    - name: install binaryen (wasm-opt)
      shell: bash
      # Ubuntu's binaryen package is too old to parse the reference-types instructions rustc
      # emits for wasm32 by default; use a pinned upstream release, checked against its SHA-256.
      env:
        BINARYEN_VERSION: version_133
        BINARYEN_SHA256: 2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489
      run: |
        archive="binaryen-${BINARYEN_VERSION}-x86_64-linux.tar.gz"
        curl -sSfL -o "$RUNNER_TEMP/$archive" "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN_VERSION}/$archive"
        echo "${BINARYEN_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
        tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
        echo "$RUNNER_TEMP/binaryen-${BINARYEN_VERSION}/bin" >> "$GITHUB_PATH"
    - name: setup pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - name: setup node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node-version
        cache: pnpm
    - name: install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
